---
- include_vars: ../../global-vars.yml

- name: install apt packages
  apt:
    name:
      - gnupg
      - python3-debian

- name: add apt repository
  deb822_repository:
    name: docker
    types: deb
    uris: 'https://download.docker.com/linux/{{ ansible_facts["distribution"] | lower }}'
    suites: '{{ ansible_facts["distribution_release"] }}'
    components: stable
    architectures: '{{ deb_architecture[ansible_facts["architecture"]] }}'
    signed_by: 'https://download.docker.com/linux/{{ ansible_facts["distribution"] | lower }}/gpg'

- name: install apt packages
  apt:
    name: docker-ce
    update_cache: true

- name: setup docker daemon config
  vars:
    daemon_config: >-
      {{
        (docker_live_restore | ternary({'live-restore': true}, {}))
        | combine((docker_data_root | length > 0) | ternary({'data-root': docker_data_root}, {}))
        | combine((docker_registry_url | length > 0) | ternary({'registry-mirrors': [docker_registry_url]}, {}))
        | combine((docker_insecure_registries | length > 0) | ternary({'insecure-registries': docker_insecure_registries}, {}))
      }}
  copy:
    content: "{{ daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
  notify: restart docker

- include_tasks: remote.yml
  when: docker_cert_name | length > 0
