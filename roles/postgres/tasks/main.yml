---
- name: install the common package
  apt:
    name:
      - postgresql-common
      - python3-debian

- name: create configured PostgreSQL data directory
  file:
    path: '{{ postgres_data_dir }}'
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  when: postgres_data_dir | length > 0

- name: configure default PostgreSQL cluster data directory
  lineinfile:
    path: /etc/postgresql-common/createcluster.conf
    regexp: '^#?data_directory\s*='
    line: "data_directory = '{{ postgres_data_dir }}'"
  when: postgres_data_dir | length > 0

- name: add apt repository
  deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: '{{ ansible_distribution_release }}-pgdg'
    components: main
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc

- name: install apt packages
  apt:
    name: '{{item}}'
    update_cache: true
  loop:
    - '{{ postgres_package_name }}'
    - python3-psycopg2

- name: create users
  become: true
  become_user: postgres
  postgresql_user:
    name: '{{item.user}}'
    password: '{{item.password}}'
  loop: '{{postgres_apps}}'

- name: create databases
  become: true
  become_user: postgres
  postgresql_db:
    name: '{{item.db}}'
    owner: '{{item.user}}'
  loop: '{{postgres_apps}}'

- name: grant privileges
  become: true
  become_user: postgres
  postgresql_privs:
    database: '{{item.db}}'
    role: '{{item.user}}'
    type: database
    privs: ALL
  loop: '{{postgres_apps}}'

- name: find postgresql.conf
  find:
    path: /etc/postgresql/
    recurse: true
    patterns: postgresql.conf
  register: postgresql_conf
  when: postgres_remote_access or postgres_wal_level == 'logical'

- name: debug postgresql_conf
  debug:
    var: postgresql_conf

- name: listen on all addresses
  lineinfile:
    path: '{{ item.path }}'
    regexp: 'listen_addresses ='
    line: "listen_addresses = '*'"
    firstmatch: true
  loop: "{{ postgresql_conf.files }}"
  when: postgres_remote_access
  notify: restart postgresql

# Logical replication is required by the app's CREATE PUBLICATION statements
# (see SpeedBackend src/db/migrations/publications.sql). wal_level is a
# server-level setting that is not carried by pg_dump, so it must be set here.
- name: set wal_level for logical replication
  lineinfile:
    path: '{{ item.path }}'
    regexp: '^#?\s*wal_level\s*='
    line: "wal_level = logical"
    firstmatch: true
  loop: "{{ postgresql_conf.files }}"
  when: postgres_wal_level == 'logical'
  notify: restart postgresql

- name: find pg_hba.conf
  find:
    path: /etc/postgresql/
    recurse: true
    patterns: pg_hba.conf
  register: pg_hba_conf
  when: postgres_remote_access

- name: allow all users to connect from all ipv4 addresses
  lineinfile:
    path: '{{ item.path }}'
    regexp: 'host all all 0.0.0.0/0 scram-sha-256'
    line: "host all all 0.0.0.0/0 scram-sha-256"
    firstmatch: true
  loop: "{{ pg_hba_conf.files }}"
  when: postgres_remote_access
  notify: restart postgresql

- name: allow all users to connect from all ipv6 addresses
  lineinfile:
    path: '{{ item.path }}'
    regexp: 'host all all ::/0 scram-sha-256'
    line: "host all all ::/0 scram-sha-256"
    firstmatch: true
  loop: "{{ pg_hba_conf.files }}"
  when: postgres_remote_access
  notify: restart postgresql

- include_tasks: dump.yml
